services:
  postgres:
    image: postgres:18-alpine
    container_name: vigil-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybersentinel}
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
    - ${POSTGRES_HOST_PORT:-16969}:5432
    volumes:
    - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-vigil} -d ${POSTGRES_DB:-cybersentinel}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
    - vigil
  redis:
    image: redis:7.4-alpine
    container_name: vigil-redis
    command: redis-server --appendonly yes
    ports:
    - ${REDIS_HOST_PORT:-26969}:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
    - vigil
  backend:
    build:
      context: .
      dockerfile: infra/docker/fastapi.dev
    container_name: vigil-backend
    environment:
      ENV: development
      DEBUG: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_KEY: ${API_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:-change-this-demo-secret}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vigil}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-cybersentinel}
      REDIS_URL: redis://redis:6379
      NGINX_LOG_PATH: /var/log/nginx/access.log
      GEOIP_DB_PATH: /usr/share/GeoIP/GeoLite2-City.mmdb
      MODEL_DIR: /app/data/models
      SKIP_AUTO_TRAIN: ${SKIP_AUTO_TRAIN:-true}
      SIM_TARGET_URL: ${SIM_TARGET_URL:-http://devlog-nginx}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      MANUAL_ALLOWED_HOSTS: ${MANUAL_ALLOWED_HOSTS:-devlog-nginx,vigil-devlog-nginx,localhost,127.0.0.1}
    ports:
    - ${BACKEND_HOST_PORT:-36969}:8000
    volumes:
    - ./backend:/app
    - model_data:/app/data/models
    - nginx_logs:/var/log/nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      devlog-nginx:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
    - vigil
  frontend:
    build:
      context: .
      dockerfile: infra/docker/vite.dev
    container_name: vigil-frontend
    environment:
      VITE_API_TARGET: http://backend:8000
      CI: 'true'
    ports:
    - ${FRONTEND_HOST_PORT:-46969}:5173
    volumes:
    - ./frontend:/app
    - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
    - vigil
  devlog-app:
    build:
      context: ./dev-log
    container_name: vigil-devlog-app
    networks:
    - vigil
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  devlog-nginx:
    image: nginx:alpine
    container_name: vigil-devlog-nginx
    command: sh -c "rm -f /var/log/nginx/access.log /var/log/nginx/error.log && exec
      nginx -g 'daemon off;'"
    ports:
    - ${DEVLOG_HOST_PORT:-58319}:80
    volumes:
    - ./dev-log/nginx.conf:/etc/nginx/nginx.conf:ro
    - nginx_logs:/var/log/nginx
    depends_on:
      devlog-app:
        condition: service_healthy
    networks:
    - vigil
volumes:
  postgres_data: null
  redis_data: null
  model_data: null
  frontend_node_modules: null
  nginx_logs: {}
networks:
  vigil:
    driver: bridge
