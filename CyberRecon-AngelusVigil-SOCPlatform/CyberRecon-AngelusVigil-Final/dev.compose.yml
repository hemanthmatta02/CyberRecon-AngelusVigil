# CyberRecon + CyberSentinel standalone Docker Compose
services:
  postgres:
    image: postgres:18-alpine
    container_name: vigil-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cybersentinel}
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "${POSTGRES_HOST_PORT:-16969}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigil} -d ${POSTGRES_DB:-cybersentinel}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [vigil]

  redis:
    image: redis:7.4-alpine
    container_name: vigil-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-26969}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [vigil]

  backend:
    build:
      context: .
      dockerfile: infra/docker/fastapi.dev
    container_name: vigil-backend
    environment:
      ENV: development
      DEBUG: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_KEY: ${API_KEY:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vigil}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-cybersentinel}
      REDIS_URL: redis://redis:6379
      NGINX_LOG_PATH: /var/log/nginx/access.log
      GEOIP_DB_PATH: /usr/share/GeoIP/GeoLite2-City.mmdb
      MODEL_DIR: /app/data/models
      SKIP_AUTO_TRAIN: ${SKIP_AUTO_TRAIN:-true}
    ports:
      - "${BACKEND_HOST_PORT:-36969}:8000"
    volumes:
      - ./backend:/app
      - model_data:/app/data/models
      - nginx_logs:/var/log/nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [vigil]

  frontend:
    build:
      context: .
      dockerfile: infra/docker/vite.dev
    container_name: vigil-frontend
    environment:
      VITE_API_TARGET: http://backend:8000
      CI: "true"
    ports:
      - "${FRONTEND_HOST_PORT:-46969}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks: [vigil]

volumes:
  postgres_data:
  redis_data:
  model_data:
  nginx_logs:
  frontend_node_modules:

networks:
  vigil:
    driver: bridge
